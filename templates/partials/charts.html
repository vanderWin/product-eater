<section class="section-card" id="section-charts">
  <h3>Search Volume Charts</h3>

  {% if not has_data %}
  <p class="info-banner">Fetch Google Ads volumes first to plot charts.</p>
  {% else %}

  <div class="chart-container">
    <canvas id="chart-chronological"></canvas>
  </div>
  <script type="application/json" class="chartjs-spec" data-target="chart-chronological">
    {{ chronological_spec | tojson | safe }}
  </script>

  <div class="chart-container">
    <canvas id="chart-seasonality"></canvas>
  </div>
  <script type="application/json" class="chartjs-spec" data-target="chart-seasonality">
    {{ seasonality_spec | tojson | safe }}
  </script>

  {% endif %}
</section>
